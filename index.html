<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Message to Discord Webhook</title>
  <script>
    function sendMessageToWebhook() {
      const webhookUrl = 'https://discord.com/api/webhooks/1368152490910023740/DyLyeEic8T66YhblKB13Ecf9KCgDpyfQ5DaA6qQdwmPSsw3GjcVif-RRRAwnr_SmzLWU';
      const data = {
        content: "✅ This is a test message sent from HTML & JavaScript.",
        username: "Webhook Bot",
        avatar_url: "https://i.imgur.com/4M34hi2.png"  // optional
      };

      // Send the POST request
      fetch(webhookUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      })
      .then(response => {
        if (response.ok) {
          alert("Message sent successfully!");
        } else {
          alert("Failed to send message.");
        }
      })
      .catch(error => {
        console.error("Error sending message:", error);
        alert("Error sending message.");
      });
    }
  </script>
</head>
<body>
  <h1>Hi!</h1>
  <button onclick="sendMessageToWebhook()">Continue</button>
</body>
</html>
